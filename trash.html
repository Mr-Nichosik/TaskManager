<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Simple task manager app uses local storage in your browser.">

  <title>TaskManager</title>

  <template id="note-template">
    <article class="note">
      <h4 class="note-title"></h4>
      <p class="note-text"></p>
    </article>
  </template>
</head>

<body>
  <header>
    <div class="burger-button-block">
      <button id="burger-button" class="header-button">☰</button>
    </div>

    <div class="header-title-block">
      <h1>Task Manager</h1>
    </div>

    <div class="header-search-block">
      <input id="search-input" placeholder="Search your task here...">
      <button id="search-button" class="header-button"><img src="./icons/search.svg" alt="search"></button>
    </div>
  </header>

  <main>
    <div class="side-bar">
      <nav class="left-links-block">
        <a class="sidebar-link" href="./">
          <img src="./icons/dashborad.svg" alt="dashboard">
          <p>Dashboard</p>
        </a>

        <a class="sidebar-link">
          <img src="./icons/tasks-categories.svg" alt="task categories">
          <p>Task categories</p>
        </a>

        <a class="sidebar-link active" href="./trash.html">
          <img src="./icons/trash-active.svg" alt="trash">
          <p>Trash</p>
        </a>
      </nav>

      <div class="sidebar-github-link-block">
        <a id="sidebar-github-link" class="sidebar-link" target="_blank"
          href="https://github.com/Mr-Nichosik/TaskManager">GtiHub</a>
      </div>
    </div>

    <section class="content">
      <div class="content-block">
        <div class="content-container-wrapper">
          <h4 class="content-container-title">Trash</h4>

          <div class="content-container">

          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="burger-menu-block">
    <nav class="burger-menu">
      <a class="burger-link" href="./">Dashboard</a>

      <a class="burger-link">Task categories</a>

      <a class="burger-link active" href="./trash.html">Trash</a>

      <a class="burger-link" target="_blank" href="https://github.com/Mr-Nichosik/TaskManager">GitHub</a>

      <button id="close-burger-button">✕</button>
    </nav>
  </div>

  <div id="overlay"></div>

  <script type="module" src="./src/scripts/trash.js"></script>
</body>

</html>
